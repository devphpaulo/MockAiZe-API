[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "mockaize-api"
version = "0.2.0.dev0"
description = "Serviço standalone de catálogo e geração XML do MockAíZé"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.2"]

[project.optional-dependencies]
windows = ["pywin32>=311; sys_platform == 'win32'"]
packaging = ["pyinstaller>=6.22,<7", "build>=1.3,<2"]

[project.scripts]
mockaize-api = "mockaize_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mockaize_api"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "packaging", "pyproject.toml", "README.md", "THIRD_PARTY_NOTICES.md"]
