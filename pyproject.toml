[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "mockaize-api"
version = "0.1.0.dev0"
description = "Serviço standalone de catálogo e geração XML do MockAíZé"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mockaize-api = "mockaize_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mockaize_api"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "packaging", "pyproject.toml", "README.md"]
