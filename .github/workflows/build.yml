name: Test and build API package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development package and builder
        run: python -m pip install -e . build
      - name: Run tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build
      - name: Install wheel outside checkout
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/wheel-check"
          $wheel = (Get-ChildItem dist/*.whl).FullName
          & "$env:RUNNER_TEMP/wheel-check/Scripts/python.exe" -m pip install --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location $env:RUNNER_TEMP
          & "$env:RUNNER_TEMP/wheel-check/Scripts/mockaize-api.exe" --version
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: mockaize-api-python-${{ matrix.python }}
          path: dist/*
