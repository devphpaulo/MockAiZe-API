name: Build Windows binaries

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development package and builder
        run: python -m pip install -e '.[windows]' build
      - name: Run tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build
      - name: Install wheel outside checkout
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/wheel-check"
          $wheel = (Get-ChildItem dist/*.whl).FullName
          & "$env:RUNNER_TEMP/wheel-check/Scripts/python.exe" -m pip install --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location $env:RUNNER_TEMP
          & "$env:RUNNER_TEMP/wheel-check/Scripts/mockaize-api.exe" --version
          exit $LASTEXITCODE
  windows-installer:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Windows build dependencies
        run: python -m pip install -e '.[windows,packaging]'
      - name: Build self-contained service and desktop setup
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Exercise frozen service without installing it
        run: python packaging/smoke.py --binary dist/MockAiZeApiService/MockAiZeApiService.exe
      - name: Exercise all frozen Qt interfaces without changing the installation
        run: python packaging/smoke_ui.py --binary dist/MockAiZeApiConfig.exe --binary dist/MockAiZeApiUninstall.exe --binary dist/MockAiZe-API-Setup.exe
      - name: Upload only Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: MockAiZe-API-Setup-Windows-x64
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          path: |
            release/MockAiZe-API-Setup.exe
            release/MockAiZeApiUninstall.exe
